# Use this file instead of wokwi.toml when you build with plain ESP-IDF
# (idf.py build). Rename it to wokwi.toml before starting the simulator.
[wokwi]
version = 1
firmware = "build/flasher_args.json"
elf = "build/cocis_scms.elf"
rfc2217ServerPort = 4001

[[net.forward]]
from = "localhost:9080"
to = "target:80"
